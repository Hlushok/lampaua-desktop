name: Build libmpv From Preserved Sources

on:
  workflow_dispatch:
    inputs:
      target:
        description: "mpv builds the SDK; ngtcp2 only diagnoses the QUIC backend"
        type: choice
        options: [mpv, ngtcp2]
        default: mpv

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      image: ghcr.io/shinchiro/archlinux@sha256:2b81f07c567b051455b9539770a71b53dd3add5f9ef52eca95ac01a2272e9fdf
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Test source and compatibility contracts
        shell: bash
        run: |
          python3 scripts/mpv/test_source_capture.py
          python3 scripts/mpv/test_static_openssl.py
          python3 scripts/mpv/test_source_preflight.py
          python3 scripts/mpv/test_curl_compat.py

      - name: Download and verify pinned sources before compilation
        shell: bash
        env:
          LAMPAUA_MPV_TARGET: ${{ inputs.target }}
          LAMPAUA_MPV_PHASE: inputs
        run: bash scripts/mpv/build-libmpv.sh

      - name: Compile baseline Windows x64 libmpv
        shell: bash
        env:
          LAMPAUA_MPV_TARGET: ${{ inputs.target }}
          LAMPAUA_MPV_PHASE: compile
        run: |
          bash scripts/mpv/build-libmpv.sh

      - name: Upload SDK and corresponding sources for verification
        if: inputs.target == 'mpv'
        uses: actions/upload-artifact@v6
        with:
          name: lampaua-libmpv-own-x64
          compression-level: 0
          retention-days: 30
          path: dist/libmpv-own/

      - name: Preserve diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lampaua-libmpv-build-logs
          retention-days: 14
          path: |
            .cache/libmpv-own/build/**/*.log
            .cache/libmpv-own/build/**/CMakeConfigureLog.yaml
            .cache/libmpv-own/build/CMakeCache.txt
            .cache/libmpv-own/sources/*.json
            .cache/libmpv-own/sources/projects/*.json
            .cache/libmpv-own/sources/rust-version.txt
