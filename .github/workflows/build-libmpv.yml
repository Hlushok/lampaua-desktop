name: Build libmpv From Preserved Sources

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Separate experimental D3D11 SDK or the unchanged baseline"
        type: choice
        options: [baseline, d3d11]
        default: baseline
      target:
        description: "mpv builds the SDK; ngtcp2 only diagnoses the QUIC backend"
        type: choice
        options: [mpv, ngtcp2]
        default: mpv

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      image: ${{ inputs.variant == 'd3d11' && 'ghcr.io/shinchiro/archlinux@sha256:4a65616f389fa2a76955876a3e380284d3057cc04bfcac986008f20a710a0b76' || 'ghcr.io/shinchiro/archlinux@sha256:2b81f07c567b051455b9539770a71b53dd3add5f9ef52eca95ac01a2272e9fdf' }}
    env:
      LAMPAUA_MPV_VARIANT: ${{ inputs.variant }}
      MPV_WORK: ${{ inputs.variant == 'd3d11' && '.cache/libmpv-own-d3d11' || '.cache/libmpv-own' }}
      MPV_OUTPUT: ${{ inputs.variant == 'd3d11' && 'dist/libmpv-own-d3d11' || 'dist/libmpv-own' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check refreshed candidate environment before compilation
        if: inputs.variant == 'd3d11'
        shell: bash
        run: |
          python3 scripts/mpv/preflight_environment.py --config build/libmpv-source-build.d3d11.json --output "$MPV_WORK/environment.json"

      - name: Test source and compatibility contracts
        shell: bash
        run: |
          python3 -m unittest discover -s scripts/mpv -p 'test_*.py'

      - name: Download and verify pinned sources before compilation
        shell: bash
        env:
          LAMPAUA_MPV_TARGET: ${{ inputs.target }}
          LAMPAUA_MPV_PHASE: inputs
        run: bash scripts/mpv/build-libmpv.sh

      - name: Compile ${{ inputs.variant }} Windows x64 libmpv
        shell: bash
        env:
          LAMPAUA_MPV_TARGET: ${{ inputs.target }}
          LAMPAUA_MPV_PHASE: compile
        run: |
          bash scripts/mpv/build-libmpv.sh

      - name: Upload SDK and corresponding sources for verification
        if: inputs.target == 'mpv'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.variant == 'd3d11' && 'lampaua-libmpv-own-x64-d3d11' || 'lampaua-libmpv-own-x64' }}
          compression-level: 0
          retention-days: 30
          path: ${{ env.MPV_OUTPUT }}/

      - name: Preserve built SDK and inputs after a packaging failure
        if: failure() && inputs.target == 'mpv' && hashFiles(format('{0}/build/mpv-dev-x86_64-*/libmpv-2.dll', env.MPV_WORK)) != ''
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.variant == 'd3d11' && 'lampaua-libmpv-unpackaged-x64-d3d11' || 'lampaua-libmpv-unpackaged-x64' }}
          compression-level: 0
          retention-days: 14
          include-hidden-files: true
          path: |
            ${{ env.MPV_WORK }}/build/mpv-dev-x86_64-*/
            ${{ env.MPV_WORK }}/sources/
            ${{ env.MPV_WORK }}/recipes/
            ${{ env.MPV_WORK }}/build/CMakeCache.txt
            ${{ env.MPV_WORK }}/build/cmake/
            ${{ env.MPV_OUTPUT }}/
            !${{ env.MPV_WORK }}/recipes/.git/**

      - name: Preserve diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.variant == 'd3d11' && 'lampaua-libmpv-d3d11-build-logs' || 'lampaua-libmpv-build-logs' }}
          retention-days: 14
          path: |
            ${{ env.MPV_WORK }}/build/**/*.log
            ${{ env.MPV_WORK }}/build/**/CMakeConfigureLog.yaml
            ${{ env.MPV_WORK }}/build/CMakeCache.txt
            ${{ env.MPV_WORK }}/sources/*.json
            ${{ env.MPV_WORK }}/sources/projects/*.json
            ${{ env.MPV_WORK }}/sources/rust-version.txt
            ${{ env.MPV_WORK }}/environment.json
